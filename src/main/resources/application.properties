# Spring Boot Configuration

# Server port
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/somali_ai_agent
spring.datasource.username=your_postgres_username
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update # validate, update, create, create-drop. Use 'validate' or 'none' for production.
spring.jpa.show-sql=true # Set to false in production for cleaner logs
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Twilio Configuration
twilio.account.sid=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
twilio.auth.token=your_auth_token
twilio.phone.number=+1234567890

# Spring AI Configuration

# Option A: OpenAI
# Uncomment and provide your API key if using OpenAI
# spring.ai.openai.api-key=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# spring.ai.openai.chat.options.model=gpt-4o
# spring.ai.openai.chat.options.temperature=0.7

# Option B: Ollama
# Uncomment and configure if using a local Ollama instance
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.1 # Ensure this model is pulled in Ollama
# spring.ai.ollama.chat.options.temperature=0.7


# Logging Configuration (Example)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG # To see generated SQL, can be noisy
logging.level.com.example.somaliaiagent=DEBUG # Your application's base package

# Actuator Endpoints (Optional, for monitoring)
# management.endpoints.web.exposure.include=health,info,metrics
# management.endpoint.health.show-details=always

